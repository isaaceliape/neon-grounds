# Static site: online rooms run entirely in browsers (WebRTC), so the
# game can be hosted on GitHub Pages with no server.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Install and test
        run: |
          npm ci
          npm test
      - name: Build the site
        run: npm run build
      - name: Stamp the service-worker cache
        run: |
          # Stamp the built worker with this commit so every deploy busts
          # the old shell: the worker installs the fresh files, deletes
          # older neon-grounds-* caches on activate, and takes over open tabs.
          ver="neon-grounds-$(git rev-parse --short HEAD)"
          sed -i "s/const CACHE = 'neon-grounds-v[0-9][0-9]*'/const CACHE = '${ver}'/" dist/sw.js
          grep -q "const CACHE = '${ver}'" dist/sw.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
